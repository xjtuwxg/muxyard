name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/*website*.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/*website*.mjs'
      - '.github/workflows/pages.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Install tmux and Electron libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Integration tests
        if: runner.os != 'Windows'
        run: npm run test:integration
      - name: Desktop UI tests (macOS)
        if: runner.os == 'macOS'
        run: npm run test:ui
      - name: Desktop UI smoke tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:ui -- --grep 'desktop demo|SSH import|appearance presets'
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-failures-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
